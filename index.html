<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArDrop — Кейсы Standoff 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0b0e14; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh; padding-bottom: 70px;
        }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background-color: #11151c;
            border-bottom: 1px solid #1f2530; position: sticky; top: 0; z-index: 50;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: #f57c00; }
        .logo-icon {
            background-color: #f57c00; color: #0b0e14; width: 36px; height: 36px;
            border-radius: 8px; display: flex; align-items: center;
            justify-content: center; font-size: 20px; font-weight: 900;
        }
        .balance {
            background-color: #1a1d24; padding: 8px 16px; border-radius: 20px;
            font-size: 14px; color: #ffb300; font-weight: 700;
            border: 1px solid #2a2e38; display: flex; align-items: center; gap: 6px;
        }
        .gold-icon { width: 20px; height: 16px; flex-shrink: 0; }

        .screen { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 15px; color: #fff; }
        .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .case-card {
            background-color: #151920; border: 1px solid #1f2530; border-radius: 16px;
            padding: 12px; text-align: center; transition: transform 0.2s, border-color 0.2s;
            cursor: pointer; position: relative;
        }
        .case-card:hover { transform: translateY(-4px); border-color: #f57c00; }
        .case-image {
            width: 100%; height: 90px;
            background: linear-gradient(135deg, #1f2530, #2a2e38);
            border-radius: 12px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 40px;
        }
        .case-title { font-size: 13px; font-weight: 600; color: #e0e0e0; margin-bottom: 4px; }
        .case-price {
            font-size: 12px; color: #8a919f;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .case-price .price-val { color: #ffb300; font-weight: 700; }

        .case-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .back-btn {
            background-color: #1a1d24; border: 1px solid #2a2e38; color: #e0e0e0;
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: background-color 0.2s;
        }
        .back-btn:hover { background-color: #2a2e38; }
        .case-header-info h2 { font-size: 18px; color: #fff; margin-bottom: 4px; }
        .case-header-info p { font-size: 13px; color: #8a919f; display: flex; align-items: center; gap: 4px; }

        .case-controls {
            background-color: #11151c; border: 1px solid #1f2530;
            border-radius: 16px; padding: 15px; margin-bottom: 20px;
        }
        .btn-deposit {
            width: 100%; background-color: #1a1d24; border: 1px solid #2a2e38;
            color: #e0e0e0; border-radius: 12px; padding: 14px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: background-color 0.2s, border-color 0.2s; margin-bottom: 15px;
        }
        .btn-deposit:hover { background-color: #2a2e38; border-color: #f57c00; }

        .quantity-selector { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .qty-btn {
            flex: 1; min-width: 45px; background-color: #1a1d24;
            border: 1px solid #2a2e38; color: #8a919f; border-radius: 10px;
            padding: 12px 0; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .qty-btn.active { background-color: #2a2e38; color: #fff; border-color: #f57c00; }
        .qty-btn:hover { background-color: #2a2e38; color: #fff; }

        .fast-open-toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-top: 1px solid #1f2530;
        }
        .fast-open-label { display: flex; align-items: center; gap: 8px; color: #8a919f; font-size: 14px; font-weight: 500; }
        .lightning-icon { color: #f57c00; font-size: 16px; }

        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2a2e38; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background-color: white;
            transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #f57c00; }
        input:checked + .slider:before { transform: translateX(22px); }

        .roulette-wrapper {
            position: relative; background-color: #11151c;
            border: 1px solid #1f2530; border-radius: 16px;
            overflow: hidden; margin-bottom: 20px; height: 140px;
            display: flex; align-items: center;
        }
        .roulette-line {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 3px;
            background-color: #f57c00; z-index: 10; transform: translateX(-50%);
            box-shadow: 0 0 15px rgba(245, 124, 0, 0.8);
        }
        .roulette-line::before, .roulette-line::after {
            content: ''; position: absolute; left: 50%; transform: translateX(-50%);
            border: 8px solid transparent;
        }
        .roulette-line::before { top: -8px; border-top-color: #f57c00; }
        .roulette-line::after { bottom: -8px; border-bottom-color: #f57c00; }

        .roulette-track {
            display: flex; gap: 8px; padding: 15px;
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1); will-change: transform;
        }
        .roulette-item {
            flex-shrink: 0; width: 100px; height: 100px;
            background: linear-gradient(135deg, #1f2530, #2a2e38);
            border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px;
            border: 1px solid #2a2e38; font-size: 28px; overflow: hidden;
        }
        .roulette-item .item-emoji { font-size: 40px; }
        .roulette-item .item-name {
            font-size: 9px; color: #8a919f; text-align: center;
            padding: 0 4px; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; width: 100%;
        }
        .roulette-item.rare { border-color: #f57c00; box-shadow: 0 0 15px rgba(245, 124, 0, 0.3); }

        .insufficient-funds {
            display: none; background-color: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3); color: #ff5252;
            padding: 12px 16px; border-radius: 12px; text-align: center;
            font-size: 14px; font-weight: 600; margin-bottom: 15px;
        }
        .insufficient-funds.show { display: block; }

        .btn-open-case {
            width: 100%; background-color: #f57c00; color: #0b0e14;
            border: none; border-radius: 12px; padding: 16px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: background-color 0.2s, transform 0.1s; margin-bottom: 20px;
        }
        .btn-open-case:hover:not(:disabled) { background-color: #e65100; }
        .btn-open-case:active:not(:disabled) { transform: scale(0.98); }
        .btn-open-case:disabled { background-color: #2a2e38; color: #8a919f; cursor: not-allowed; }

        .drop-result {
            background-color: #151920; border: 1px solid #1f2530;
            border-radius: 16px; padding: 20px; text-align: center;
            display: none; animation: popIn 0.4s ease;
        }
        .drop-result.show { display: block; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .drop-result h3 { font-size: 16px; color: #8a919f; margin-bottom: 10px; font-weight: 500; }
        .drop-item-emoji { font-size: 60px; margin-bottom: 10px; display: block; }
        .drop-name { font-size: 18px; font-weight: 700; color: #f57c00; }

        .case-contents { margin-top: 30px; border-top: 1px solid #1f2530; padding-top: 20px; }
        .contents-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 15px; }
        .contents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .content-item {
            background-color: #151920; border: 1px solid #1f2530;
            border-radius: 12px; padding: 10px; text-align: center;
            transition: border-color 0.2s;
        }
        .content-item:hover { border-color: #f57c00; }
        .content-item .content-emoji { font-size: 40px; margin-bottom: 6px; }
        .content-item .content-name {
            font-size: 10px; color: #e0e0e0; font-weight: 600;
            margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .content-item .content-price { font-size: 10px; color: #ffb300; font-weight: 700; }

        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .inv-item {
            background-color: #151920; border: 1px solid #1f2530;
            border-radius: 12px; padding: 12px; text-align: center;
        }
        .inv-item .inv-emoji { font-size: 40px; margin-bottom: 6px; }
        .inv-item .inv-name { font-size: 12px; font-weight: 600; color: #e0e0e0; margin-bottom: 4px; }
        .inv-item .inv-price {
            font-size: 12px; color: #ffb300; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 3px;
            margin-bottom: 8px;
        }
        .btn-sell {
            width: 100%; background-color: #2a2e38; border: none;
            color: #e0e0e0; border-radius: 8px; padding: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-sell:hover { background-color: #f57c00; color: #0b0e14; }
        .empty-inv { text-align: center; color: #8a919f; padding: 40px 20px; font-size: 14px; }
                /* === Апгрейдер === */
        .upgrader-container {
            background-color: #0b0e14;
            min-height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }

        .upgrader-top {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .upgrader-balance {
            background-color: #1a1d24;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            color: #ffb300;
            font-weight: 700;
            border: 1px solid #2a2e38;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 10px 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        .wheel-bg-circle {
            fill: none;
            stroke: #1f2530;
            stroke-width: 24;
        }

        .wheel-chance-circle {
            fill: none;
            stroke: #ff3b30;
            stroke-width: 24;
            stroke-linecap: butt;
            transition: stroke-dasharray 0.4s ease;
        }

        .wheel-center {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 40%, #2a2e38 0%, #151920 70%, #0b0e14 100%);
            border: 4px solid #1f2530;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        .wheel-percent {
            font-size: 34px;
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }

        .wheel-center-emoji {
            font-size: 44px;
            margin-bottom: 4px;
            line-height: 1;
        }

        .wheel-result-icon {
            font-size: 50px;
            font-weight: 900;
            line-height: 1;
        }
        .wheel-result-icon.win { color: #00ff88; text-shadow: 0 0 15px rgba(0,255,136,0.8); }
        .wheel-result-icon.lose { color: #ff3b30; text-shadow: 0 0 15px rgba(255,59,48,0.8); }

        .wheel-arrow-wrapper {
            position: absolute;
            width: 280px;
            height: 280px;
            z-index: 4;
            pointer-events: none;
            transition: transform 3.2s cubic-bezier(0.15, 0.7, 0.2, 1);
        }

        .wheel-arrow {
            position: absolute;
            left: 50%;
            top: 6px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 18px solid #f57c00;
            filter: drop-shadow(0 0 6px rgba(245, 124, 0, 0.9));
        }

        .upgrade-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 90%;
            max-width: 380px;
            margin-bottom: 15px;
        }

        .btn-fast-upgrade {
            width: 50px;
            height: 50px;
            min-width: 50px;
            border-radius: 50%;
            background-color: #1a1d24;
            border: 1px solid #2a2e38;
            color: #f57c00;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-fast-upgrade:hover { background-color: #2a2e38; border-color: #f57c00; }
        .btn-fast-upgrade.active { background-color: #f57c00; color: #0b0e14; }

        .btn-improve {
            flex: 1;
            background-color: #1a1d24;
            border: 1px solid #2a2e38;
            color: #fff;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-improve:hover { background-color: #2a2e38; border-color: #f57c00; }
        .btn-improve:disabled { opacity: 0.5; cursor: not-allowed; }

        .upgrader-chances {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .chance-btn {
            background-color: #1a1d24;
            border: 1px solid #2a2e38;
            color: #8a919f;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chance-btn.active { background-color: #2a2e38; color: #f57c00; border-color: #f57c00; }

        .upgrade-skins {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
            margin-bottom: 15px;
            gap: 15px;
        }

        .upgrade-skin {
            flex: 1;
            text-align: center;
            background-color: #151920;
            border: 1px solid #1f2530;
            border-radius: 12px;
            padding: 12px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .upgrade-skin:hover { border-color: #f57c00; }
        .upgrade-skin .skin-emoji { font-size: 40px; }
        .upgrade-skin .skin-label { font-size: 11px; color: #8a919f; margin-top: 6px; }
        .upgrade-arrow { color: #f57c00; font-size: 22px; font-weight: 700; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.8);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background-color: #151920;
            border: 1px solid #1f2530;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-close {
            background-color: #2a2e38;
            border: none;
            color: #e0e0e0;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        .modal-close:hover { background-color: #f57c00; color: #0b0e14; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: #11151c; border-top: 1px solid #1f2530;
            display: flex; justify-content: space-around;
            padding: 8px 0; z-index: 50;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: #8a919f; font-size: 11px; cursor: pointer;
            padding: 5px 15px; border-radius: 10px;
            transition: color 0.2s; background: none; border: none;
        }
        .nav-item.active { color: #f57c00; }
        .nav-item .nav-icon { font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <div class="logo-icon">A</div>
            <span>ArDrop</span>
        </div>
        <div class="balance">
            <svg class="gold-icon" viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6L2 20H30L28 6H4Z" fill="url(#goldGrad)"/>
                <path d="M2 20L1 24H31L30 20H2Z" fill="#8B6914"/>
                <path d="M4 6L2 20H30L28 6H4Z" stroke="#FFE066" stroke-width="0.8"/>
                <path d="M6 8L5 10H29L28 8H6Z" fill="#FFE066" opacity="0.4"/>
                <defs>
                    <linearGradient id="goldGrad" x1="2" y1="6" x2="30" y2="20" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#FFD700"/><stop offset="0.5" stop-color="#FFA500"/><stop offset="1" stop-color="#CC8800"/>
                    </linearGradient>
                </defs>
            </svg>
            <span id="balanceDisplay">5000</span>
        </div>
    </div>

    <div class="screen active" id="screen-cases">
        <div class="section-title">Кейсы</div>
        <div class="cases-grid" id="casesGrid"></div>
    </div>

    <div class="screen" id="screen-case">
        <div class="case-header">
            <button class="back-btn" onclick="showScreen('cases')">←</button>
            <div class="case-header-info">
                <h2 id="caseTitle">Кейс</h2>
                <p>Цена: <span style="color: #ffb300;" id="casePrice">0</span></p>
            </div>
        </div>

        <div class="case-controls">
            <button class="btn-deposit" onclick="alert('Функция пополнения в разработке')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                Пополнить баланс
            </button>
            <div class="quantity-selector">
                <button class="qty-btn active" onclick="setQuantity(1)">1</button>
                <button class="qty-btn" onclick="setQuantity(2)">2</button>
                <button class="qty-btn" onclick="setQuantity(3)">3</button>
                <button class="qty-btn" onclick="setQuantity(4)">4</button>
                <button class="qty-btn" onclick="setQuantity(5)">5</button>
                <button class="qty-btn" onclick="setQuantity(10)">10</button>
            </div>
            <div class="fast-open-toggle">
                <div class="fast-open-label"><span class="lightning-icon">⚡</span><span>Открыть быстро</span></div>
                <label class="switch"><input type="checkbox" id="fastOpenCheckbox"><span class="slider"></span></label>
            </div>
        </div>

        <div class="roulette-wrapper" id="rouletteWrapper">
            <div class="roulette-line"></div>
            <div class="roulette-track" id="rouletteTrack"></div>
        </div>

        <div class="insufficient-funds" id="insufficientFunds">
            <div>На балансе <span id="currentBalanceWarn">0</span> из <span id="requiredBalanceWarn">0</span></div>
            <div style="font-size: 12px; color: #8a919f; margin-top: 4px;">Пополните еще на <span id="missingBalance">0</span></div>
        </div>

        <button class="btn-open-case" id="openCaseBtn" onclick="spinRoulette()">Открыть кейс</button>

        <div class="drop-result" id="dropResult">
            <h3>Вам выпало:</h3>
            <span class="drop-item-emoji" id="dropIcon">🎁</span>
            <div class="drop-name" id="dropName">Предмет</div>
        </div>

        <div class="case-contents">
            <h3 class="contents-title">Содержимое кейса <span id="contentsCaseName">Кейс</span></h3>
            <div class="contents-grid" id="contentsGrid"></div>
        </div>
    </div>

    <div class="screen" id="screen-inventory">
        <div class="section-title">Инвентарь</div>
        <div class="inventory-grid" id="inventoryGrid"></div>
    </div>

    <div class="screen" id="screen-upgrader">
        <div class="upgrader-container">
            <div class="upgrader-top">
                <div class="upgrader-balance">
                    <span id="upgraderBalanceDisplay">5000</span> 🪙
                </div>
            </div>

            <div class="wheel-wrapper">
                <svg class="wheel-svg" viewBox="0 0 280 280">
                    <circle class="wheel-bg-circle" cx="140" cy="140" r="110"></circle>
                    <circle class="wheel-chance-circle" id="chanceCircle" cx="140" cy="140" r="110"
                            stroke-dasharray="0 691"></circle>
                </svg>
                <div class="wheel-center">
                    <div class="wheel-center-emoji" id="wheelCenterEmoji">🎁</div>
                    <div class="wheel-percent" id="wheelPercent">50%</div>
                </div>
                <div class="wheel-arrow-wrapper" id="wheelArrowWrapper">
                    <div class="wheel-arrow"></div>
                </div>
            </div>

            <div class="upgrade-controls">
                <button class="btn-fast-upgrade" id="fastUpgradeBtn" onclick="toggleFastUpgrade()">⚡</button>
                <button class="btn-improve" id="improveBtn" onclick="doUpgrade()">
                    <span style="font-size: 18px;">🛡</span> Улучшить
                </button>
            </div>

            <div class="upgrader-chances">
                <button class="chance-btn active" onclick="setMultiplier(2)">x2</button>
                <button class="chance-btn" onclick="setMultiplier(3)">x3</button>
                <button class="chance-btn" onclick="setMultiplier(5)">x5</button>
                <button class="chance-btn" onclick="setMultiplier(10)">x10</button>
                <button class="chance-btn" onclick="setMultiplier(25)">x25</button>
            </div>

            <div class="upgrade-skins">
                <div class="upgrade-skin" onclick="openInventoryModal('source')">
                    <div class="skin-emoji" id="upgradeSkinEmoji">➕</div>
                    <div class="skin-label" id="upgradeSkinLabel">Выбрать скин</div>
                </div>
                <div class="upgrade-arrow">→</div>
                <div class="upgrade-skin" onclick="openTargetModal()">
                    <div class="skin-emoji" id="targetSkinEmoji">🎯</div>
                    <div class="skin-label" id="targetSkinLabel">Подбирается автоматически</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Выберите скин</div>
            <div class="inventory-grid" id="modalGrid"></div>
            <button class="modal-close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="showScreen('cases')" id="navCases">
            <span class="nav-icon">📦</span><span>Кейсы</span>
        </button>
        <button class="nav-item" onclick="showScreen('inventory')" id="navInventory">
            <span class="nav-icon">🎒</span><span>Инвентарь</span>
        </button>
        <button class="nav-item" onclick="showScreen('upgrader')" id="navUpgrader">
            <span class="nav-icon">⬆️</span><span>Апгрейд</span>
        </button>
    </div>
    <script>
    const cases = [
        { id: 1, name: "Стартовый", price: 49, icon: "📦" },
        { id: 2, name: "Новичок", price: 99, icon: "🎁" },
        { id: 3, name: "Любитель", price: 199, icon: "💎" },
        { id: 4, name: "Профи", price: 499, icon: "🔥" },
        { id: 5, name: "Элита", price: 999, icon: "👑" },
        { id: 6, name: "Легенда", price: 1999, icon: "⭐" }
    ];

    const possibleDrops = [
        { name: "AK-47 | Redline", emoji: "🔫", price: 250 },
        { name: "AWP | Asiimov", emoji: "🎯", price: 500 },
        { name: "M4A4 | Howl", emoji: "🔫", price: 1200 },
        { name: "Нож | Fade", emoji: "🗡️", price: 2500 },
        { name: "Перчатки | Pandora", emoji: "🧤", price: 1800 },
        { name: "USP-S | Neo-Noir", emoji: "🔫", price: 350 },
        { name: "Glock-18 | Water Elemental", emoji: "🔫", price: 150 },
        { name: "Desert Eagle | Blaze", emoji: "🔫", price: 800 },
        { name: "AWP | Dragon Lore", emoji: "🎯", price: 5000 },
        { name: "Керамбит | Doppler", emoji: "🗡️", price: 3500 }
    ];

    // === Автосохранение ===
    function saveState() {
        localStorage.setItem('ardrop_save', JSON.stringify({ balance, inventory }));
    }

    function loadState() {
        const saved = localStorage.getItem('ardrop_save');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                balance = data.balance ?? 5000;
                inventory = data.inventory ?? [];
            } catch (e) { console.error(e); }
        }
    }

    let balance = 5000;
    let inventory = [];
    let currentCase = null;
    let isSpinning = false;
    let selectedQuantity = 1;
    let isFastOpen = false;
    let currentMultiplier = 2;
    let isFastUpgrade = false;
    let selectedSourceIndex = null;
    let selectedTargetIndex = null;
    let manualTargetSelected = false;

    loadState();
    updateBalance();
    renderCases();
    renderInventory();
    updateWheelChance();

    function renderCases() {
        const grid = document.getElementById('casesGrid');
        grid.innerHTML = '';
        cases.forEach(c => {
            const card = document.createElement('div');
            card.className = 'case-card';
            card.onclick = () => openCaseScreen(c.id);
            card.innerHTML = `
                <div class="case-image">${c.icon}</div>
                <div class="case-title">${c.name}</div>
                <div class="case-price">Цена: <span class="price-val">${c.price}</span> 🪙</div>`;
            grid.appendChild(card);
        });
    }

    function setQuantity(qty) {
        selectedQuantity = qty;
        document.querySelectorAll('.qty-btn').forEach(btn => {
            btn.classList.remove('active');
            if (parseInt(btn.textContent) === qty) btn.classList.add('active');
        });
        checkBalance();
    }

    document.getElementById('fastOpenCheckbox').addEventListener('change', (e) => {
        isFastOpen = e.target.checked;
    });

    function openCaseScreen(id) {
        currentCase = cases.find(c => c.id === id);
        if (!currentCase) return;
        document.getElementById('caseTitle').textContent = currentCase.name;
        document.getElementById('casePrice').textContent = currentCase.price;
        document.getElementById('contentsCaseName').textContent = currentCase.name;
        document.getElementById('dropResult').classList.remove('show');
        document.getElementById('openCaseBtn').disabled = false;
        document.getElementById('openCaseBtn').textContent = 'Открыть кейс';
        document.getElementById('insufficientFunds').classList.remove('show');
        setQuantity(1);
        renderCaseContents();
        buildRouletteTrack();
        checkBalance();
        showScreen('case');
    }

    function renderCaseContents() {
        const grid = document.getElementById('contentsGrid');
        grid.innerHTML = '';
        possibleDrops.forEach(item => {
            const el = document.createElement('div');
            el.className = 'content-item';
            el.innerHTML = `
                <div class="content-emoji">${item.emoji}</div>
                <div class="content-name">${item.name}</div>
                <div class="content-price">${item.price} 🪙</div>`;
            grid.appendChild(el);
        });
    }

    function checkBalance() {
        if (!currentCase) return;
        const totalCost = currentCase.price * selectedQuantity;
        if (balance < totalCost) {
            document.getElementById('currentBalanceWarn').textContent = balance;
            document.getElementById('requiredBalanceWarn').textContent = totalCost;
            document.getElementById('missingBalance').textContent = (totalCost - balance).toFixed(2);
            document.getElementById('insufficientFunds').classList.add('show');
            document.getElementById('openCaseBtn').disabled = true;
        } else {
            document.getElementById('insufficientFunds').classList.remove('show');
            document.getElementById('openCaseBtn').disabled = false;
        }
    }

    function buildRouletteTrack() {
        const track = document.getElementById('rouletteTrack');
        track.style.transition = 'none';
        track.style.transform = 'translateX(0)';
        track.innerHTML = '';
        for (let i = 0; i < 50; i++) {
            const item = possibleDrops[Math.floor(Math.random() * possibleDrops.length)];
            const el = document.createElement('div');
            el.className = 'roulette-item' + (item.price > 1000 ? ' rare' : '');
            el.innerHTML = `<span class="item-emoji">${item.emoji}</span><span class="item-name">${item.name}</span>`;
            track.appendChild(el);
        }
    }

    function spinRoulette() {
        if (isSpinning || !currentCase) return;
        const totalCost = currentCase.price * selectedQuantity;
        if (balance < totalCost) { checkBalance(); return; }

        isSpinning = true;
        document.getElementById('openCaseBtn').disabled = true;
        document.getElementById('openCaseBtn').textContent = 'Крутим...';
        document.getElementById('dropResult').classList.remove('show');
        document.getElementById('insufficientFunds').classList.remove('show');

        balance -= totalCost;
        updateBalance();
        saveState();

        const droppedItem = possibleDrops[Math.floor(Math.random() * possibleDrops.length)];

        if (isFastOpen) {
            setTimeout(() => {
                inventory.push(droppedItem);
                renderInventory();
                saveState();
                document.getElementById('dropIcon').textContent = droppedItem.emoji;
                document.getElementById('dropName').textContent = droppedItem.name;
                document.getElementById('dropResult').classList.add('show');
                isSpinning = false;
                document.getElementById('openCaseBtn').disabled = false;
                document.getElementById('openCaseBtn').textContent = 'Открыть ещё раз';
                checkBalance();
            }, 300);
            return;
        }

        buildRouletteTrack();
        const track = document.getElementById('rouletteTrack');
        const items = track.children;
        const targetIndex = 40;

        const dropEl = document.createElement('div');
        dropEl.className = 'roulette-item' + (droppedItem.price > 1000 ? ' rare' : '');
        dropEl.innerHTML = `<span class="item-emoji">${droppedItem.emoji}</span><span class="item-name">${droppedItem.name}</span>`;
        track.replaceChild(dropEl, items[targetIndex]);

        const itemWidth = 100 + 8;
        const wrapperWidth = document.querySelector('.roulette-wrapper').offsetWidth;
        const centerOffset = wrapperWidth / 2 - 100 / 2;
        const targetPosition = targetIndex * itemWidth - centerOffset;

        setTimeout(() => {
            track.style.transition = 'transform 4s cubic-bezier(0.2, 0.8, 0.2, 1)';
            track.style.transform = `translateX(-${targetPosition}px)`;
        }, 50);

        setTimeout(() => {
            isSpinning = false;
            document.getElementById('openCaseBtn').disabled = false;
            document.getElementById('openCaseBtn').textContent = 'Открыть ещё раз';
            document.getElementById('dropIcon').textContent = droppedItem.emoji;
            document.getElementById('dropName').textContent = droppedItem.name;
            document.getElementById('dropResult').classList.add('show');
            inventory.push(droppedItem);
            renderInventory();
            saveState();
            checkBalance();
        }, 4200);
    }

    function renderInventory() {
        const grid = document.getElementById('inventoryGrid');
        grid.innerHTML = '';
        if (inventory.length === 0) {
            grid.innerHTML = '<div class="empty-inv">Инвентарь пуст. Откройте кейс!</div>';
            return;
        }
        inventory.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'inv-item';
            el.innerHTML = `
                <div class="inv-emoji">${item.emoji}</div>
                <div class="inv-name">${item.name}</div>
                <div class="inv-price">${item.price} 🪙</div>
                <button class="btn-sell" onclick="sellItem(${index})">Продать</button>`;
            grid.appendChild(el);
        });
    }

    function sellItem(index) {
        balance += inventory[index].price;
        inventory.splice(index, 1);
        updateBalance();
        renderInventory();
        saveState();
    }

    function setMultiplier(mult) {
        currentMultiplier = mult;
        document.querySelectorAll('.chance-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent === `x${mult}`) btn.classList.add('active');
        });

        if (selectedSourceIndex !== null && !manualTargetSelected) {
            autoPickTarget();
        } else if (selectedSourceIndex !== null && selectedTargetIndex !== null) {
            updateWheelChance();
        }
    }

    function autoPickTarget() {
        if (selectedSourceIndex === null) return;
        const src = inventory[selectedSourceIndex];
        if (!src) return;

        const targetPrice = src.price * currentMultiplier;

        let bestIndex = 0;
        let bestDiff = Infinity;
        possibleDrops.forEach((drop, i) => {
            const diff = Math.abs(drop.price - targetPrice);
            if (diff < bestDiff) {
                bestDiff = diff;
                bestIndex = i;
            }
        });

        selectedTargetIndex = bestIndex;
        const tgt = possibleDrops[bestIndex];

        document.getElementById('targetSkinEmoji').textContent = tgt.emoji;
        document.getElementById('targetSkinLabel').textContent = `${tgt.name} (${tgt.price} 🪙)`;

        updateWheelChance();
    }

    function updateCircleArc(chancePercent) {
        const radius = 110;
        const circumference = 2 * Math.PI * radius;
        const arcLength = (chancePercent / 100) * circumference;
        const circle = document.getElementById('chanceCircle');
        circle.setAttribute('stroke-dasharray', `${arcLength} ${circumference - arcLength}`);
        circle.setAttribute('stroke-dashoffset', '0');
    }

    function updateWheelChance() {
        if (selectedSourceIndex === null || selectedTargetIndex === null) return;
        const src = inventory[selectedSourceIndex];
        const tgt = possibleDrops[selectedTargetIndex];
        if (!src || !tgt) return;
        if (tgt.price <= src.price) {
            document.getElementById('wheelPercent').textContent = '0%';
            updateCircleArc(0);
            return;
        }
        const chance = (src.price / tgt.price) * 100;
        document.getElementById('wheelPercent').textContent = `${chance.toFixed(1)}%`;
        updateCircleArc(chance);
    }

    function toggleFastUpgrade() {
        isFastUpgrade = !isFastUpgrade;
        document.getElementById('fastUpgradeBtn').classList.toggle('active', isFastUpgrade);
    }
                let modalMode = 'source';

        function openInventoryModal(mode) {
            modalMode = mode;
            document.getElementById('modalTitle').textContent = mode === 'source' ? 'Выберите свой скин' : 'Выберите что получите';
            const grid = document.getElementById('modalGrid');
            grid.innerHTML = '';
            const list = mode === 'source' ? inventory : possibleDrops;
            if (list.length === 0) {
                grid.innerHTML = '<div class="empty-inv">Нет скинов</div>';
            } else {
                list.forEach((item, index) => {
                    const el = document.createElement('div');
                    el.className = 'inv-item';
                    el.style.cursor = 'pointer';
                    el.innerHTML = `
                        <div class="inv-emoji">${item.emoji}</div>
                        <div class="inv-name">${item.name}</div>
                        <div class="inv-price">${item.price} 🪙</div>`;
                    el.onclick = () => selectFromModal(mode, index);
                    grid.appendChild(el);
                });
            }
            document.getElementById('modalOverlay').classList.add('show');
        }

        function openTargetModal() { openInventoryModal('target'); }

        function selectFromModal(mode, index) {
            if (mode === 'source') {
                selectedSourceIndex = index;
                manualTargetSelected = false;
                const item = inventory[index];
                document.getElementById('upgradeSkinEmoji').textContent = item.emoji;
                document.getElementById('upgradeSkinLabel').textContent = `${item.name} (${item.price} 🪙)`;
                document.getElementById('wheelCenterEmoji').textContent = item.emoji;
                document.getElementById('wheelCenterEmoji').style.display = 'block';
                autoPickTarget();
            } else {
                selectedTargetIndex = index;
                manualTargetSelected = true;
                const item = possibleDrops[index];
                document.getElementById('targetSkinEmoji').textContent = item.emoji;
                document.getElementById('targetSkinLabel').textContent = `${item.name} (${item.price} 🪙)`;
                updateWheelChance();
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function doUpgrade() {
            if (selectedSourceIndex === null) { alert('Выберите свой скин'); return; }
            if (selectedTargetIndex === null) { alert('Выберите что получите'); return; }

            const sourceItem = inventory[selectedSourceIndex];
            const targetItem = possibleDrops[selectedTargetIndex];

            if (targetItem.price <= sourceItem.price) {
                alert('Целевой скин должен быть дороже исходного!');
                return;
            }

            const chance = (sourceItem.price / targetItem.price) * 100;
            const roll = Math.random() * 100;
            const isWin = roll < chance;

            document.getElementById('improveBtn').disabled = true;
            document.getElementById('improveBtn').textContent = 'Крутим...';

            document.getElementById('wheelPercent').style.display = 'none';
            document.getElementById('wheelCenterEmoji').style.display = 'none';

            const chanceAngle = (chance / 100) * 360;
            let finalAngle = Math.random() * 360;

            if (isWin) {
                finalAngle = Math.random() * chanceAngle;
            } else {
                finalAngle = chanceAngle + Math.random() * (360 - chanceAngle);
            }

            const totalRotation = 360 * 4 + finalAngle;

            const wrapper = document.getElementById('wheelArrowWrapper');
            wrapper.style.transition = 'transform 3.2s cubic-bezier(0.15, 0.7, 0.2, 1)';
            wrapper.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                const resultIcon = document.createElement('div');
                resultIcon.className = 'wheel-result-icon ' + (isWin ? 'win' : 'lose');
                resultIcon.textContent = isWin ? '✓' : '✕';

                const center = document.querySelector('.wheel-center');
                const oldIcon = center.querySelector('.wheel-result-icon');
                if (oldIcon) oldIcon.remove();
                center.appendChild(resultIcon);

                if (isWin) {
                    inventory.splice(selectedSourceIndex, 1);
                    inventory.push(targetItem);
                } else {
                    inventory.splice(selectedSourceIndex, 1);
                }

                selectedSourceIndex = null;
                selectedTargetIndex = null;
                manualTargetSelected = false;
                document.getElementById('upgradeSkinEmoji').textContent = '➕';
                document.getElementById('upgradeSkinLabel').textContent = 'Выбрать скин';
                document.getElementById('targetSkinEmoji').textContent = '🎯';
                document.getElementById('targetSkinLabel').textContent = 'Подбирается автоматически';
                document.getElementById('improveBtn').disabled = false;
                document.getElementById('improveBtn').innerHTML = '<span style="font-size: 18px;">🛡</span> Улучшить';

                renderInventory();
                updateBalance();
                saveState();

                setTimeout(() => {
                    if (resultIcon.parentNode) resultIcon.remove();
                    document.getElementById('wheelPercent').style.display = 'block';
                    document.getElementById('wheelCenterEmoji').style.display = 'block';
                    document.getElementById('wheelCenterEmoji').textContent = '🎁';
                    document.getElementById('wheelPercent').textContent = '50%';
                    updateCircleArc(50);

                    wrapper.style.transition = 'none';
                    wrapper.style.transform = 'rotate(0deg)';
                    setTimeout(() => {
                        wrapper.style.transition = 'transform 3.2s cubic-bezier(0.15, 0.7, 0.2, 1)';
                    }, 50);
                }, 2000);

            }, 3400);
        }

        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if (name === 'cases') {
                document.getElementById('screen-cases').classList.add('active');
                document.getElementById('navCases').classList.add('active');
            } else if (name === 'case') {
                document.getElementById('screen-case').classList.add('active');
                document.getElementById('navCases').classList.add('active');
            } else if (name === 'inventory') {
                document.getElementById('screen-inventory').classList.add('active');
                document.getElementById('navInventory').classList.add('active');
                renderInventory();
            } else if (name === 'upgrader') {
                document.getElementById('screen-upgrader').classList.add('active');
                document.getElementById('navUpgrader').classList.add('active');
                updateBalance();

                document.getElementById('wheelCenterEmoji').textContent = '🎁';
                document.getElementById('wheelCenterEmoji').style.display = 'block';
                document.getElementById('wheelPercent').style.display = 'block';
                document.getElementById('wheelPercent').textContent = '50%';
                updateCircleArc(50);

                selectedSourceIndex = null;
                selectedTargetIndex = null;
                manualTargetSelected = false;
                document.getElementById('upgradeSkinEmoji').textContent = '➕';
                document.getElementById('upgradeSkinLabel').textContent = 'Выбрать скин';
                document.getElementById('targetSkinEmoji').textContent = '🎯';
                document.getElementById('targetSkinLabel').textContent = 'Подбирается автоматически';
            }
        }

        function updateBalance() {
            document.getElementById('balanceDisplay').textContent = balance.toLocaleString('ru-RU');
            const upgBal = document.getElementById('upgraderBalanceDisplay');
            if (upgBal) upgBal.textContent = balance.toLocaleString('ru-RU');
        }
    </script>
</body>
</html>
