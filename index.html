<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>promo-so2 — Генератор промокодов</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at top, #1f2b3a, #0a0e14 70%);
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 30px 15px;
  }

  .app {
    width: 100%;
    max-width: 640px;
    background: #131a24;
    border: 1px solid #22303f;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }

  header { text-align: center; margin-bottom: 22px; }
  h1 { color: #ff9d2e; font-size: 28px; letter-spacing: 1px; }
  .subtitle { color: #8a97a6; font-size: 13px; margin-top: 4px; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .field label {
    font-size: 13px;
    color: #8a97a6;
  }

  input, select {
    background: #0d131b;
    border: 1px solid #2a3947;
    color: #e6edf3;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    width: 100%;
  }

  input:focus, select:focus { border-color: #ff9d2e; }

  button {
    background: linear-gradient(135deg, #ff9d2e, #ff6a00);
    border: none;
    color: #131a24;
    font-weight: 700;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: transform .15s, filter .15s;
    font-family: inherit;
  }

  button:hover { filter: brightness(1.1); transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .generate-btn { width: 100%; margin-top: 6px; }

  .codes {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 340px;
    overflow-y: auto;
    margin: 18px 0 16px;
  }

  .codes li {
    background: #0d131b;
    border: 1px solid #22303f;
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    animation: fade .25s ease;
  }

  @keyframes fade { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; } }

  .code-text {
    font-family: 'Consolas', monospace;
    font-size: 15px;
    color: #4dd0e1;
    letter-spacing: 2px;
  }

  .reward-tag {
    font-size: 11px;
    color: #ff9d2e;
    background: rgba(255,157,46,.1);
    padding: 3px 8px;
    border-radius: 12px;
    display: inline-block;
    margin-top: 4px;
  }

  .copy-btn {
    background: #22303f;
    color: #e6edf3;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
  }

  .actions { display: flex; gap: 10px; margin-bottom: 18px; }
  .secondary { background: #22303f; color: #e6edf3; flex: 1; }

  .disclaimer {
    font-size: 11px;
    color: #586675;
    text-align: center;
    line-height: 1.5;
  }

  /* ===== Своё модальное окно ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 12, .75);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 100;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: #131a24;
    border: 1px solid #2a3947;
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
    transform: translateY(-10px);
    transition: transform .2s ease;
  }

  .modal-overlay.active .modal { transform: translateY(0); }

  .modal h2 {
    font-size: 17px;
    color: #ff9d2e;
    margin-bottom: 6px;
  }

  .modal p {
    font-size: 13px;
    color: #8a97a6;
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .modal-actions button { flex: 1; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎯 promo-so2</h1>
      <p class="subtitle">by a24s1tn1kof-design</p>
    </header>

    <div class="field">
      <label>Тип награды</label>
      <select id="rewardType">
        <option value="gold">💰 Голда</option>
        <option value="skins">🔫 Скины</option>
      </select>
    </div>

    <div class="field" id="goldField">
      <label>Количество голды</label>
      <input type="number" id="goldAmount" value="100" min="1" placeholder="Например: 100">
    </div>

    <div class="field" id="skinsField" style="display:none;">
      <label>Название скина</label>
      <input type="text" id="skinName" placeholder="Например: AKR Red Dragon">
    </div>

    <div class="field">
      <label>Количество промокодов</label>
      <input type="number" id="count" value="5" min="1" max="100">
    </div>

    <button class="generate-btn" id="generate">Сгенерировать</button>

    <ul id="codes" class="codes"></ul>

    <div class="actions">
      <button id="copyAll" class="secondary">📋 Копировать все</button>
      <button id="clear" class="secondary">🗑 Очистить</button>
    </div>

    <p class="disclaimer">
      © promo-so2 — демонстрационный генератор.
      Не связан с официальной игрой Standoff 2. Реальные награды не выдаёт.
    </p>
  </div>

  <!-- Своё модальное окно «Количество активаций» -->
  <div class="modal-overlay" id="activationModal">
    <div class="modal">
      <h2>Количество активаций</h2>
      <p>Укажите, сколько раз можно активировать каждый промокод.</p>
      <input type="number" id="activationInput" value="1" min="1" max="9999">
      <div class="modal-actions">
        <button class="secondary" id="cancelActivation">Отмена</button>
        <button id="confirmActivation">Подтвердить</button>
      </div>
    </div>
  </div>

<script>
  const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const CODE_LENGTH = 12;

  // Криптостойкий генератор
  function randomInt(max) {
    if (window.crypto && window.crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] % max;
    }
    return Math.floor(Math.random() * max);
  }

  // Промокод без дефисов: AAAAAAAAAAAA
  function generateCode() {
    let code = '';
    for (let i = 0; i < CODE_LENGTH; i++) {
      code += ALPHABET[randomInt(ALPHABET.length)];
    }
    return code;
  }

  const usedCodes = new Set();

  function generateUnique() {
    let code, attempts = 0;
    do {
      code = generateCode();
      attempts++;
      if (attempts > 200) break;
    } while (usedCodes.has(code));
    usedCodes.add(code);
    return code;
  }

  // ===== UI =====
  const codesList = document.getElementById('codes');
  const btnGenerate = document.getElementById('generate');
  const btnCopyAll = document.getElementById('copyAll');
  const btnClear = document.getElementById('clear');
  const rewardType = document.getElementById('rewardType');
  const goldField = document.getElementById('goldField');
  const skinsField = document.getElementById('skinsField');
  const goldAmount = document.getElementById('goldAmount');
  const skinName = document.getElementById('skinName');
  const countInput = document.getElementById('count');

  // Переключение полей голда/скины
  rewardType.addEventListener('change', () => {
    if (rewardType.value === 'gold') {
      goldField.style.display = 'flex';
      skinsField.style.display = 'none';
    } else {
      goldField.style.display = 'none';
      skinsField.style.display = 'flex';
    }
  });

  // Собираем описание награды
  function getRewardLabel() {
    if (rewardType.value === 'gold') {
      const amount = Math.max(1, +goldAmount.value || 0);
      return `${amount} голды`;
    } else {
      const name = skinName.value.trim() || 'Скин';
      return name;
    }
  }

  function createCodeElement(code, reward, activations) {
    const li = document.createElement('li');

    const left = document.createElement('div');
    const spanCode = document.createElement('div');
    spanCode.className = 'code-text';
    spanCode.textContent = code;

    const spanReward = document.createElement('span');
    spanReward.className = 'reward-tag';
    spanReward.textContent = `${reward} · ${activations} акт.`;

    left.appendChild(spanCode);
    left.appendChild(spanReward);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'Копировать';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(code).then(() => {
        copyBtn.textContent = '✓';
        setTimeout(() => (copyBtn.textContent = 'Копировать'), 1200);
      });
    };

    li.appendChild(left);
    li.appendChild(copyBtn);
    return li;
  }

  // ===== Своё модальное окно =====
  const modal = document.getElementById('activationModal');
  const activationInput = document.getElementById('activationInput');
  const confirmBtn = document.getElementById('confirmActivation');
  const cancelBtn = document.getElementById('cancelActivation');

  function openActivationModal() {
    return new Promise((resolve) => {
      activationInput.value = 1;
      modal.classList.add('active');
      setTimeout(() => activationInput.focus(), 100);

      function onConfirm() {
        const val = Math.max(1, Math.min(9999, +activationInput.value || 1));
        cleanup();
        resolve(val);
      }

      function onCancel() {
        cleanup();
        resolve(null);
      }

      function onKey(e) {
        if (e.key === 'Enter') onConfirm();
        if (e.key === 'Escape') onCancel();
      }

      function cleanup() {
        modal.classList.remove('active');
        confirmBtn.removeEventListener('click', onConfirm);
        cancelBtn.removeEventListener('click', onCancel);
        document.removeEventListener('keydown', onKey);
      }

      confirmBtn.addEventListener('click', onConfirm);
      cancelBtn.addEventListener('click', onCancel);
      document.addEventListener('keydown', onKey);
    });
  }

  // ===== Генерация =====
  btnGenerate.addEventListener('click', async () => {
    // Сначала спрашиваем количество активаций через своё окно
    const activations = await openActivationModal();
    if (activations === null) return; // отмена

    const count = Math.min(100, Math.max(1, +countInput.value || 1));
    const reward = getRewardLabel();

    codesList.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const code = generateUnique();
      codesList.appendChild(createCodeElement(code, reward, activations));
    }
  });

  btnCopyAll.addEventListener('click', () => {
    const items = [...codesList.querySelectorAll('.code-text')].map(el => el.textContent);
    if (!items.length) return;
    navigator.clipboard.writeText(items.join('\n')).then(() => {
      btnCopyAll.textContent = '✓ Скопировано';
      setTimeout(() => (btnCopyAll.textContent = '📋 Копировать все'), 1200);
    });
  });

  btnClear.addEventListener('click', () => {
    codesList.innerHTML = '';
    usedCodes.clear();
  });
</script>
</body>
 </html>
