<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кейсы Standoff 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e14;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding: 15px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 20px;
            border-bottom: 1px solid #1f2530;
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #f57c00;
        }

        .logo-icon {
            background-color: #f57c00;
            color: #0b0e14;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
        }

        .balance {
            background-color: #1a1d24;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #00bcd4;
            font-weight: 600;
            border: 1px solid #2a2e38;
        }

        /* Сетка кейсов */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .case-card {
            background-color: #151920;
            border: 1px solid #1f2530;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .case-card:hover {
            transform: translateY(-4px);
            border-color: #f57c00;
        }

        .case-image {
            width: 100%;
            height: 100px;
            background: linear-gradient(135deg, #1f2530, #2a2e38);
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            position: relative;
        }

        /* Заглушки для картинок (эмодзи, т.к. нет реальных изображений) */
        .case-image span {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .case-title {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .case-price {
            font-size: 13px;
            color: #8a919f;
        }

        .case-price span {
            color: #f57c00;
            font-weight: 700;
        }

        /* Кнопка открытия (появляется при наведении) */
        .case-open {
            margin-top: 12px;
            width: 100%;
            background-color: #f57c00;
            color: #0b0e14;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s, transform 0.2s;
        }

        .case-card:hover .case-open {
            opacity: 1;
            transform: translateY(0);
        }

        /* Сообщение об открытии */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #1a1d24;
            border: 1px solid #f57c00;
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.3s ease;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast span {
            color: #f57c00;
        }

        /* Адаптив для очень маленьких экранов */
        @media (max-width: 400px) {
            .cases-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .case-image {
                height: 80px;
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">B</div>
            <span>BulDrop</span>
        </div>
        <div class="balance" id="balanceDisplay">0 ₽</div>
    </div>

    <!-- Сетка кейсов -->
    <div class="cases-grid" id="casesGrid">
        <!-- Кейсы будут добавлены через JS -->
    </div>

    <!-- Всплывающее уведомление -->
    <div class="toast" id="toast">Вы открыли кейс!</div>

    <script>
        // Данные кейсов (пока что 6 штук, как вы просили — поменьше)
        const cases = [
            { id: 1, name: "Стартовый кейс", price: 49, icon: "📦" },
            { id: 2, name: "Новичок", price: 99, icon: "🎁" },
            { id: 3, name: "Любитель", price: 199, icon: "💎" },
            { id: 4, name: "Профи", price: 499, icon: "🔥" },
            { id: 5, name: "Элита", price: 999, icon: "👑" },
            { id: 6, name: "Легенда", price: 1999, icon: "⭐" }
        ];

        let balance = 5000; // Стартовый баланс для теста

        // Отрисовка кейсов
        function renderCases() {
            const grid = document.getElementById('casesGrid');
            grid.innerHTML = '';
            
            cases.forEach(c => {
                const card = document.createElement('div');
                card.className = 'case-card';
                card.innerHTML = `
                    <div class="case-image"><span>${c.icon}</span></div>
                    <div class="case-title">${c.name}</div>
                    <div class="case-price">Цена: <span>${c.price} ₽</span></div>
                    <button class="case-open" onclick="openCase(${c.id})">Открыть</button>
                `;
                grid.appendChild(card);
            });
        }

        // Логика открытия кейса
        function openCase(id) {
            const box = cases.find(c => c.id === id);
            if (!box) return;

            if (balance < box.price) {
                showToast(`Недостаточно средств! Нужно ${box.price} ₽`);
                return;
            }

            // Списываем баланс
            balance -= box.price;
            updateBalance();

            // Имитация выпадения скина
            const skins = ["AK-47 | Redline", "AWP | Asiimov", "M4A4 | Howl", "Нож | Fade", "Перчатки | Pandora"];
            const randomSkin = skins[Math.floor(Math.random() * skins.length)];

            showToast(`Вы открыли <span>${box.name}</span> и получили: <br><b>${randomSkin}</b>`);
        }

        // Обновление баланса
        function updateBalance() {
            document.getElementById('balanceDisplay').textContent = `${balance.toLocaleString('ru-RU')} ₽`;
        }

        // Показ уведомления
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerHTML = message;
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Инициализация
        updateBalance();
        renderCases();
    </script>

</body>
</html>
