<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор промокодов в Standoff 2</title>
    <style>
        body {
            background-color: #111318;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #1a1d24;
            border: 1px solid #2a2e38;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .header-icon {
            background-color: #f57c00;
            color: #111;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #f57c00;
            margin: 0;
        }

        .label {
            font-size: 14px;
            color: #8a919f;
            margin-bottom: 8px;
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            background-color: #0f1115;
            border: 1px solid #2a2e38;
            border-radius: 10px;
            padding: 14px 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #f57c00;
        }

        .btn-primary {
            width: 100%;
            background-color: #f57c00;
            color: #111;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #e65100;
        }

        /* Стили для блока результата */
        .result-box {
            margin-top: 25px;
            background-color: #0f1115;
            border: 1px solid #2a2e38;
            border-radius: 10px;
            padding: 15px;
            display: none; /* Скрыто по умолчанию */
        }

        .result-box.active {
            display: block;
        }

        .promo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .promo-code {
            font-family: monospace;
            font-size: 18px;
            color: #00bcd4;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .btn-copy {
            background-color: #2a2e38;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: #3a3f4d;
        }

        .promo-meta {
            display: inline-block;
            margin-top: 10px;
            background-color: rgba(245, 124, 0, 0.15);
            color: #f57c00;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .error-text {
            color: #ff5252;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-icon">P</div>
        <h1 class="header-title">Генератор промокодов в Standoff 2</h1>
    </div>

    <div class="input-group">
        <label class="label">Название скина (награда)</label>
        <input type="text" id="skinInput" class="input-field" placeholder="Например: AK-47 | Redline" value="">
        <div id="errorMsg" class="error-text">Такого скина не существует!</div>
    </div>

    <div class="input-group">
        <label class="label">Количество активаций</label>
        <input type="number" id="usesInput" class="input-field" placeholder="Например: 1" value="1" min="1">
    </div>

    <button class="btn-primary" onclick="generatePromo()">Сгенерировать промокод</button>

    <!-- Блок результата -->
    <div id="resultBox" class="result-box">
        <div class="promo-row">
            <div id="promoCode" class="promo-code">----</div>
            <button class="btn-copy" onclick="copyToClipboard()">Копировать</button>
        </div>
        <div id="promoMeta" class="promo-meta"></div>
    </div>
</div>

<script>
    // База "правдоподобных" скинов для проверки
    const validSkins = [
        "AK-47 | Redline", "AK-47 | Vulcan", "M4A4 | Howl", "AWP | Dragon Lore",
        "AWP | Asiimov", "Desert Eagle | Blaze", "USP-S | Kill Confirmed",
        "Glock-18 | Fade", "Karambit | Doppler", "M9 Bayonet | Crimson Web",
        "AK-47 | Fire Serpent", "M4A1-S | Hyper Beast", "AWP | Medusa",
        "Butterfly Knife | Fade", "Sport Gloves | Pandora's Box",
        "AK-47 | Bloodsport", "M4A4 | The Emperor", "AWP | Wildfire",
        "Desert Eagle | Printstream", "USP-S | Neo-Noir", "Glock-18 | Water Elemental"
    ];

    function generatePromo() {
        const skinInput = document.getElementById('skinInput').value.trim();
        const usesInput = document.getElementById('usesInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');
        
        // Сброс ошибок
        errorMsg.style.display = 'none';

        // Проверка на пустое поле скина
        if (!skinInput) {
            errorMsg.textContent = "Пожалуйста, введите название скина.";
            errorMsg.style.display = 'block';
            resultBox.classList.remove('active');
            return;
        }

        // Проверка на правдоподобность скина
        const isSkinValid = validSkins.some(skin => 
            skin.toLowerCase().includes(skinInput.toLowerCase()) || 
            skinInput.toLowerCase().includes(skin.toLowerCase())
        );

        if (!isSkinValid) {
            errorMsg.textContent = `Скина "${skinInput}" не существует в Standoff 2.`;
            errorMsg.style.display = 'block';
            resultBox.classList.remove('active');
            return;
        }

        // Проверка количества активаций
        let uses = parseInt(usesInput);
        if (isNaN(uses) || uses < 1) {
            uses = 1; // По умолчанию 1, если введено некорректное число
        }

        // Генерация рандомного промокода (12 символов)
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let promoCode = '';
        for (let i = 0; i < 12; i++) {
            promoCode += chars.charAt(Math.floor(Math.random() * chars.length));
        }

        // Вывод результата
        document.getElementById('promoCode').textContent = promoCode;
        document.getElementById('promoMeta').textContent = `${uses} акт. · Скин: ${skinInput}`;
        
        // Показываем блок
        resultBox.classList.add('active');
    }

    function copyToClipboard() {
        const code = document.getElementById('promoCode').textContent;
        navigator.clipboard.writeText(code).then(() => {
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.textContent;
            btn.textContent = 'Скопировано!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 1500);
        }).catch(err => {
            console.error('Ошибка копирования: ', err);
        });
    }
</script>

</body>
</html>
